<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Osiloskop Eğitimi - DS1202Z-E</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --ink:#1f2933; --sub:#52606d;
    --accent:#1d6fa5; --accent2:#c0392b; --line:#d9e2ec;
    --ok:#1f7a45; --okbg:#eaf7ec; --warn:#8a5a00; --warnbg:#fff6e5; --bad:#9b1c1c; --badbg:#fdeaea; --info:#1d4e75; --infobg:#eaf2f8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;line-height:1.55;}
  .app{max-width:1360px;margin:0 auto;padding:22px 20px 60px;}
  header.cover{background:linear-gradient(135deg,#1d6fa5,#0d3b57);color:#fff;border-radius:14px;padding:22px 28px;margin-bottom:16px;box-shadow:0 8px 24px rgba(13,59,87,.22);}
  header.cover h1{margin:0 0 4px;font-size:1.55rem;}
  header.cover p{margin:0;opacity:.9;font-size:.95rem;}
  nav#chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  nav#chips button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 13px;border-radius:20px;cursor:pointer;font-size:.88rem;}
  nav#chips button:hover{border-color:var(--accent);}
  nav#chips button.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  main{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:18px;align-items:start;}
  .stage-wrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 2px 6px rgba(15,35,55,.05);}
  svg#stage{width:100%;height:auto;display:block;user-select:none;touch-action:none;}
  .side{display:flex;flex-direction:column;gap:14px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:0 2px 6px rgba(15,35,55,.05);}
  .card h2{margin:0 0 4px;font-size:1.1rem;color:var(--accent);}
  .card .stepno{font-size:.78rem;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;}
  .card p{margin:8px 0;font-size:.95rem;}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center;}
  button.b{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 13px;border-radius:8px;cursor:pointer;font-size:.9rem;}
  button.b:hover{border-color:var(--accent);}
  button.b.pri{background:var(--accent);color:#fff;border-color:var(--accent);}
  button.b.sm{padding:5px 10px;font-size:.82rem;}
  button.b:disabled{opacity:.45;cursor:default;}
  #infoCard h2{font-size:1rem;}
  #infoCard .dyn{margin-top:8px;font-size:.84rem;color:var(--sub);border-top:1px dashed var(--line);padding-top:8px;}
  #fb{border-radius:10px;padding:11px 14px;font-size:.92rem;border-left:5px solid var(--info);background:var(--infobg);color:var(--info);min-height:48px;}
  #fb.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);}
  #fb.warn{border-color:#e0a11a;background:var(--warnbg);color:var(--warn);}
  #fb.bad{border-color:var(--accent2);background:var(--badbg);color:var(--bad);}
  .halo{fill:none;stroke:#ff8c00;stroke-width:4;display:none;animation:pulse 1s infinite;pointer-events:none;}
  @keyframes pulse{50%{stroke-opacity:.2}}
  .scb{cursor:pointer;transition:transform .08s,filter .08s;}
  .scb.scp{transform:translate(0,2px);filter:brightness(.8);}
  .scknob{cursor:grab;}
  .srcrow{margin:8px 0;font-size:.88rem;}
  .srcrow select,.srcrow input{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:.85rem;max-width:100%;}
  .srcrow input{width:78px;}
  .cust{display:none;margin-top:6px;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem;color:var(--sub);}
  .cust.on{display:flex;}
  @media (max-width:900px){main{grid-template-columns:1fr;}}
</style>
<script src="site-nav.js"></script>
</head>
<body>
<div class="app">
  <header class="cover">
    <h1>Osiloskop Kullanımı – Animasyonlu Eğitim Seti</h1>
    <p>RIGOL DS1202Z-E (2 kanal, 200 MHz, 1 GSa/s) üzerinde: ilk görüntü ve AUTO, dikey/yatay ölçek, tetikleme, ölçüm ve imleçler. Düğmelere basabilir, büyük düğmeleri sürükleyebilirsin; imleci bir parçanın üzerine getirince sağda açıklaması çıkar.</p>
  </header>
  <nav id="chips"></nav>
  <main>
    <div class="stage-wrap">
      <svg id="stage" viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg"><g id="scopeRoot"></g></svg>
    </div>
    <aside class="side">
      <div class="card" id="lessonCard"></div>
      <div class="card" id="infoCard"></div>
      <div id="fb"></div>
      <div class="card" id="srcCard"></div>
    </aside>
  </main>
</div>
<script>
/* ================= RIGOL DS1202Z-E osiloskop çekirdeği ================= */
const Scope=(function(){
'use strict';
const COL=['#ffe14a','#35d6ff'];
const TD=[],VD=[];
[-9,-8,-7,-6,-5,-4,-3,-2,-1,0,1].forEach(e=>[1,2,5].forEach(m=>{const v=+(m*Math.pow(10,e)).toPrecision(3);if(v>=5e-9&&v<=50.01)TD.push(v);}));
[-3,-2,-1,0,1].forEach(e=>[1,2,5].forEach(m=>VD.push(+(m*Math.pow(10,e)).toPrecision(3))));VD.push(100);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function siFmt(x,u){
  const a=Math.abs(x);let sc=1,p='';
  if(a>=1e9){sc=1e9;p='G';}else if(a>=1e6){sc=1e6;p='M';}else if(a>=1e3){sc=1e3;p='k';}else if(a>=1||a===0){sc=1;}else if(a>=1e-3){sc=1e-3;p='m';}else if(a>=1e-6){sc=1e-6;p='μ';}else{sc=1e-9;p='n';}
  return (+(x/sc).toPrecision(3))+p+u;
}
function shape(w,p,d){
  switch(w){
    case 'sine':return Math.sin(2*Math.PI*p);
    case 'square':case 'pulse':return p<d?1:-1;
    case 'ramp':return p<d?-1+2*p/d:1-2*(p-d)/(1-d);
    case 'arb':return 2*(1-Math.exp(-5*p))/(1-Math.exp(-5))-1;
    case 'noise':return Math.random()*2-1;
    default:return 0;
  }
}
let ARBAVG=0;{const N=1000;for(let i=0;i<N;i++)ARBAVG+=shape('arb',i/N,.5);ARBAVG/=N;}
const avgShape=(w,d)=>w==='square'||w==='pulse'?2*d-1:w==='arb'?ARBAVG:0;
const RISE_ARB=(()=>{const f=p=>2*(1-Math.exp(-5*p))/(1-Math.exp(-5))-1;let a=0,b=0;for(let i=0;i<=1000;i++){const p=i/1000,v=f(p);if(!a&&v>=-0.6)a=p;if(!b&&v>=0.6){b=p;}}return b-a;})();

/* ---------- Durum ---------- */
const vdOf=c=>c.fine?c.vv:VD[c.vi];
const newCh=()=>({on:false,fine:false,vv:1,vi:VD.indexOf(1),pos:0,coup:'DC',probe:10,inv:false,bw:false});
const defaults=()=>({power:true,run:true,mode:'auto',armed:false,status:'AUTO',sel:0,
  ch:[Object.assign(newCh(),{on:true}),newCh()],ti:TD.indexOf(1e-3),hpos:0,trig:{src:0,slope:'rise',level:0},
  menu:'ch',left:null,leftPage:0,cur:0,curA:-2,curB:2,curSel:'A',meas:['period','freq','rise','fall','pwidth'],allMeas:false,
  grid:'full',dots:false,bright:60,acq:'normal',phys:[10,10],lvlT:0,frame:null,forced:false,boot:0});
const S=defaults();
let host={getSignals:()=>[null,null],say:()=>{},info:()=>{}};
let root=null,svg=null,sigs=[null,null],dirty=true,lastDraw=0;
const say=(m,t)=>host.say(m,t||'info');
const mark=()=>{dirty=true;};

/* ---------- Konum sabitleri ---------- */
const GX0=44,GY0=18,GW=372,GH=224,DX=GW/12,DY=GH/8,GCX=GX0+GW/2,GCY=GY0+GH/2;
const KN={vpos:[721,177,15],vscale:[722,298,32],hpos:[826,178,15],hscale:[826,298,32],tlevel:[903,230,18],multi:[672,107,18]};
const KSTEP=18;
const kstate={};Object.keys(KN).forEach(k=>kstate[k]={t:0,a:0,v:0});
const BNCX=[633,735,836],BNCY=390;

/* ---------- Bilgi ---------- */
const INFO={
 screen:['Ekran','Üstte durum çubuğu (RUN/STOP, zaman tabanı, tetikleme), ortada 12×8 bölmeli ızgara, altta ölçüm kutuları ve kanal çubuğu (V/div). Sağda menü etiketleri.'],
 clear:['CLEAR','Ekrandaki ölçüm istatistiklerini ve izleri temizler.'],
 auto:['AUTO (Autoset)','Sinyale göre dikey ölçek, zaman tabanı ve tetiklemeyi otomatik ayarlar. İlk bakış için en hızlı yol; sonra elle ince ayar yapılır.'],
 runstop:['RUN/STOP','Yeşil = çalışıyor (RUN), kırmızı = durdurulmuş (STOP). STOP\'ta ekran dondurulur, dikey ölçek hâlâ değiştirilebilir.'],
 single:['SINGLE','Tek seferlik yakalama: tetikleme gelince ekranı bir kez yakalar ve durur. Geçici olayları yakalamak için kullanılır.'],
 ch1:['CH1 tuşu','Kanalı açar ve seçer; seçiliyken menüsünü açar (kuplaj, prob, ters çevirme). Kanal açık ve seçiliyken tekrar basarsan kapanır. Işığı kanal renginde yanar.'],
 ch2:['CH2 tuşu','İkinci kanalı açar/seçer. Dikey ölçek ve pozisyon düğmeleri hep seçili kanala etki eder.'],
 math:['MATH','Matematik işlemleri (A+B, A−B, FFT...). Bu eğitimde kullanılmıyor.'],
 ref:['REF','Referans dalga şekli saklama. Bu eğitimde kullanılmıyor.'],
 hmenu:['Yatay MENU','Gecikmeli tarama (zoom) menüsü. Bu eğitimde kullanılmıyor.'],
 tmode:['Tetikleme MODE','Auto → Normal → Single arasında geçiş yapar. Auto: tetikleme olmasa da ekran güncellenir (görüntü kayabilir). Normal: sadece tetikleme olunca günceller (yoksa WAIT). Single: bir kez yakalar.'],
 tmenu:['Tetikleme MENU','Tetikleme kaynağı (CH1/CH2), kenar (yükselen ↑/düşen ↓) ve çalışma modu menüsünü açar.'],
 force:['FORCE','Tetikleme koşulu olmasa bile bir yakalama zorlar (Normal/Single modda yararlı).'],
 measure:['Measure','Otomatik ölçüm menüsü. Soldaki 6 tuşla ölçüm (Period, Freq, Rise Time...) ekle/çıkar; sağdaki menüden tüm ölçümleri (AllMeasure) aç.'],
 acquire:['Acquire','Örnekleme modu (Normal, Average, Peak, High Res). Average gürültüyü azaltır.'],
 storage:['Storage','Ekran görüntüsü ve dosya saklama. Bu eğitimde sadeleştirilmiştir.'],
 cursor:['Cursor','Manuel imleçler: bir kez bas = zaman (X) imleçleri, iki kez = gerilim (Y) imleçleri, üçüncüde kapanır. İmleçleri çok işlevli düğmeyle hareket ettir; ΔX, 1/ΔX, ΔY ekranda görünür.'],
 display:['Display','Görüntü tipi (vektör/nokta), ızgara tipi ve parlaklık.'],
 utility:['Utility','Sistem ayarları. Bu eğitimde sadeleştirilmiştir.'],
 help:['Help','Yardım. Bu eğitimde kullanılmıyor.'],print:['Print','Ekranı yazdırma/kaydetme. Bu eğitimde kullanılmıyor.'],
 vpos:['Dikey POSITION','Seçili kanalın dalgasını yukarı/aşağı kaydırır (sıfır seviyesi işareti kaymaz değil, o da hareket eder). Düğmeye basarsan sıfıra döner.'],
 vscale:['Dikey SCALE','Seçili kanalın V/div ayarı. Saat yönü: bölme başına gerilim azalır (yakınlaştırma), sinyal büyür. Düğmeye basarsan Kaba (1-2-5 adım) ↔ İnce (küçük adım) ayar arasında geçilir; ince ayarda kanal çubuğunda * görünür.'],
 hpos:['Yatay POSITION','Tetikleme noktasını sağa/sola kaydırır (zaman ofseti). Düğmeye basarsan sıfıra döner.'],
 hscale:['Yatay SCALE','Zaman tabanı (s/div). Saat yönü: daha hızlı tarama (daha az zaman, dalga genişler). Üstte "H" yanında değer görünür.'],
 tlevel:['Tetikleme LEVEL','Tetikleme seviyesini ayarlar (turuncu T oku). Seviye sinyalin genlik aralığının dışındaysa tetikleme olmaz. Basarsan seviye sıfıra (0 V) döner.'],
 multi:['Çok işlevli düğme (Intensity)','İmleç modunda seçili imleci hareket ettirir. Aksi halde dalga parlaklığını (Intensity) ayarlar.'],
 bnc1:['CH1 girişi (BNC)','Prob veya BNC kabloyla gelen sinyalin girdiği konnektör. Sarı etiket kanal rengidir.'],
 bnc2:['CH2 girişi (BNC)','İkinci kanal girişi, camgöbeği etiket.'],
 ext:['EXT TRIG','Harici tetikleme girişi. Bu eğitimde kullanılmıyor.'],
 probe1:['CH1 prob anahtarı','Probun üzerindeki 1X/10X anahtarı (genelde 10X). 10X konumunda sinyal 10 kat zayıflar; osiloskop menüsündeki Probe ayarı (varsayılan 10X) anahtarla aynı olmalı, yoksa ölçüm 10 kat hatalı olur. Tıklayarak değiştir.'],
 probe2:['CH2 prob anahtarı','CH2 probunun 1X/10X anahtarı. Osiloskop Probe ayarıyla eşleşmeli.'],
 comp:['Prob kompanzasyon çıkışı','Ön panelin sağ alt köşesindeki çıkış (üst: sinyal, alt: toprak). Yaklaşık 3 V\'luk 1 kHz kare dalga verir. Yeni probu bağlayıp kompanze etmek ve prob/kanal testi için kullanılır; kalibrasyon için KULLANILMAZ. Probun ucunu bu çıkışa, timsah klipsini toprağa bağlarsın.'],
 power:['Güç düğmesi','Osiloskobu açar/kapatır.'],
 lmenu:['Sol MENU','Soldaki ölçüm menüsü sayfaları arasında geçer: Horizontal, Vertical, Other.'],
 lsoft:['Sol menü tuşları','Ekranın solundaki 6 tuş: Measure açıkken bir ölçümü ekler veya çıkarır.'],
 rsoft:['Sağ menü tuşları','Ekranın sağındaki 6 tuş ekrandaki menü seçeneklerini değiştirir (ör. kanal menüsünde Coupling, Probe).'],
 arrow:['Ok tuşları','Menü sayfalarını gezmek içindir. Bu eğitimde etkisizdir.']
};

/* ---------- SVG kurulum ---------- */
const btn=(id,x,y,w,h,lab,o={})=>{
  const L=Array.isArray(lab)?lab:[lab],fs=o.fs||8.5,cy=y+h/2-(L.length-1)*fs*.55+fs*.35;
  return `<g data-sc="${id}" data-si="${id}" class="scb"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx||6}" fill="${o.fill||'#f5f3ec'}" stroke="${o.stroke||'#9c9a90'}" stroke-width="${o.sw||1.6}"/>${L.map((t,i)=>`<text x="${x+w/2}" y="${cy+i*fs*1.1}" font-size="${fs}" font-weight="700" fill="${o.ink||'#444'}" text-anchor="middle" pointer-events="none">${t}</text>`).join('')}</g>`;
};
const soft=(id,x,y)=>`<g data-sc="${id}" data-si="${id[0]==='l'?'lsoft':'rsoft'}" class="scb"><rect x="${x}" y="${y}" width="46" height="22" rx="9" fill="#a9bfdc" stroke="#6f87a8" stroke-width="1.6"/><rect x="${x+4}" y="${y+3}" width="38" height="7" rx="3" fill="#cfe0f4" pointer-events="none"/></g>`;
function knobSvg(id){
  const [cx,cy,r]=KN[id];
  let t='';if(r>20)for(let k=0;k<20;k++)t+=`<line x1="${cx}" y1="${cy-r+2}" x2="${cx}" y2="${cy-r+6}" stroke="#bdbab0" stroke-width="2" transform="rotate(${k*18} ${cx} ${cy})"/>`;
  return `<g data-knob="${id}" data-si="${id}" class="scknob"><circle cx="${cx+1.5}" cy="${cy+2.5}" r="${r+2}" fill="#00000026"/><g id="kr-${id}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#scKnob)" stroke="#a7a499" stroke-width="2"/>${t}<circle cx="${cx}" cy="${cy-r+5}" r="2.2" fill="#d7263d"/><circle data-kpress="${id}" cx="${cx}" cy="${cy}" r="${r*.52}" fill="#f2f0e9" stroke="#b6b3a8" stroke-width="1.5"/></g></g>`;
}
function build(){
  let s=`<defs><clipPath id="scClip"><rect x="${GX0}" y="${GY0}" width="${GW}" height="${GH}"/></clipPath>
  <radialGradient id="scKnob" cx="45%" cy="38%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d3d0c6"/></radialGradient></defs>
  <rect x="12" y="0" width="936" height="495" rx="26" fill="#ebe8df" stroke="#c4c0b4" stroke-width="3"/>
  <rect x="12" y="372" width="936" height="123" rx="26" fill="#e1ded4"/><rect x="12" y="372" width="936" height="20" fill="#e1ded4"/>
  <text x="112" y="16" font-size="15" font-weight="800" fill="#c1121f">RIGOL</text><text x="180" y="16" font-size="12" font-weight="800" fill="#333">DS1202Z-E</text><text x="250" y="16" font-size="7.5" fill="#444">OSCILLOSCOPE   2 Channel  200MHz  1GSa/s</text>
  <rect x="70" y="34" width="493" height="306" rx="6" fill="#1b1b1d"/>
  <g transform="translate(78 42)" data-si="screen"><g id="scScr"></g></g>
  ${btn('lmenu',16,46,44,24,'MENU',{fill:'#a9bfdc',stroke:'#6f87a8',fs:8,rx:8})}
  ${[88,130,165,200,240,277].map((y,i)=>soft('l'+i,14,y-11)).join('')}
  ${[90,132,166,202,240,275].map((y,i)=>soft('r'+i,584,y-11)).join('')}
  ${btn('lup',14,302,46,20,'▼',{fill:'#a9bfdc',stroke:'#6f87a8',fs:9,rx:8})}
  ${btn('rup',584,46,46,20,'▲',{fill:'#a9bfdc',stroke:'#6f87a8',fs:9,rx:8})}${btn('rdown',584,302,46,20,'▼',{fill:'#a9bfdc',stroke:'#6f87a8',fs:9,rx:8})}
  ${btn('clear',668,30,54,24,'CLEAR',{fs:8})}${btn('auto',727,30,54,24,'AUTO',{fs:8})}${btn('runstop',788,30,54,24,['RUN','STOP'],{fs:7.5})}${btn('single',849,30,54,24,'SINGLE',{fs:8})}
  <rect x="712" y="64" width="148" height="82" rx="12" fill="none" stroke="#a9a69b" stroke-width="2"/><text x="866" y="108" font-size="7" fill="#777" transform="rotate(90 866 108)">MENU</text>
  ${btn('measure',720,70,40,24,'Measure',{fs:7})}${btn('acquire',765,70,40,24,'Acquire',{fs:7})}${btn('storage',810,70,40,24,'Storage',{fs:7})}
  ${btn('cursor',720,106,40,24,'Cursor',{fs:7})}${btn('display',765,106,40,24,'Display',{fs:7})}${btn('utility',810,106,40,24,'Utility',{fs:7})}
  ${btn('help',878,70,40,24,'Help',{fill:'#8fe08f',stroke:'#4a9a4a',fs:8})}${btn('print',878,106,40,24,'⎙',{fill:'#8fe08f',stroke:'#4a9a4a',fs:11})}
  <text x="650" y="76" font-size="7" fill="#666" text-anchor="middle">Intensity</text>
  <rect x="632" y="140" width="144" height="198" rx="14" fill="none" stroke="#a9a69b" stroke-width="2"/><text x="704" y="332" font-size="7" font-weight="700" fill="#777" text-anchor="middle">VERTICAL</text>
  <rect x="782" y="140" width="90" height="198" rx="14" fill="none" stroke="#a9a69b" stroke-width="2"/><text x="827" y="152" font-size="7" font-weight="700" fill="#777" text-anchor="middle">HORIZONTAL</text>
  <rect x="878" y="140" width="68" height="198" rx="14" fill="none" stroke="#a9a69b" stroke-width="2"/><text x="912" y="152" font-size="7" font-weight="700" fill="#777" text-anchor="middle">TRIGGER</text>
  <g data-sc="ch1" data-si="ch1" class="scb" id="chb1"><rect x="640" y="150" width="46" height="26" rx="7" fill="#f5f3ec" stroke="${COL[0]}" stroke-width="3"/><text x="663" y="167" font-size="9" font-weight="800" fill="#444" text-anchor="middle" pointer-events="none">CH1</text></g>
  <g data-sc="ch2" data-si="ch2" class="scb" id="chb2"><rect x="640" y="184" width="46" height="26" rx="7" fill="#f5f3ec" stroke="${COL[1]}" stroke-width="3"/><text x="663" y="201" font-size="9" font-weight="800" fill="#444" text-anchor="middle" pointer-events="none">CH2</text></g>
  ${btn('math',690,222,40,22,'MATH',{fill:'#cfcdc5',fs:7.5})}${btn('ref',736,222,36,22,'REF',{fill:'#cfcdc5',fs:7.5})}
  ${btn('hmenu',806,222,40,22,'MENU',{fs:7.5})}
  ${btn('tmode',886,172,52,22,'MODE',{fs:8})}${btn('tmenu',886,262,52,22,'MENU',{fs:8})}${btn('force',886,296,52,22,'FORCE',{fs:8})}

    let tMin=Math.max(host.tStart()+(6+S.hpos)*td,tMax-Math.max(24*td,0.004));

  else{ // single
    if(S.armed){if(tc!==null||forced){t0=(tc!==null?tc:rnd())-(6+S.hpos)*td;S.armed=false;S.run=false;st='STOP';}else st='WAIT';}

function setMode(m){

  if(m==='auto')S.status='AUTO';
  say({auto:'Auto: tetikleme olmasa da ekran güncellenir (tetiksiz görüntü kayar).',normal:'Normal: yalnızca tetikleme olunca güncellenir; olmazsa WAIT görünür.',single:'Single: tetikleme gelince bir kez yakalar ve durur.'}[m]);

function snapshot(){S.undo=JSON.parse(JSON.stringify({ch:S.ch,ti:S.ti,hpos:S.hpos,trig:S.trig,mode:S.mode,meas:S.meas}));}
function undoAuto(){if(!S.undo){say('Geri alınacak ayar yok.','warn');return;}const u=JSON.parse(JSON.stringify(S.undo));S.ch=u.ch;S.ti=u.ti;S.hpos=u.hpos;S.trig=u.trig;S.mode=u.mode;S.meas=u.meas;say('Autoset geri alındı: önceki ayarlar yüklendi.','ok');}
function chInfo(i){
  if(host.stats)return host.stats(i);
  const s=sigs[i];if(!s||!s.on)return null;
  const f=s.factor,amp=s.wave==='dc'?0:s.amp*f,mean=meanOf(s),mid=s.off*f;
  return {vmax:mid+amp/2,vmin:mid-amp/2,mean,freq:(s.wave==='dc'||s.wave==='noise')?null:s.freq,wave:s.wave,duty:s.duty};
}
function autoMode(kind){
  const ref=S.trig.src,q=chInfo(ref);
  if(!q||!q.freq){say('Bu seçenek periyodik bir sinyal gerektirir.','warn');return;}
  const T=1/q.freq;S.hpos=0;S.mode='auto';S.run=true;S.armed=false;
  if(kind==='single'){S.ti=nearest(TD,T/10);S.meas=['period','freq'];say('Tek periyot gösteriliyor; Period ve Freq ölçümü ekranın altında.','ok');}
  else if(kind==='multi'){S.ti=nearest(TD,T*4/12);S.meas=['period','freq'];say('Birkaç periyot gösteriliyor; Period ve Freq ölçümü ekranın altında.','ok');}
  else{S.meas=[kind];acquire();const M=measure(ref),t=M&&M[kind];if(!t){say('Bu sinyalde '+(kind==='rise'?'yükselme':'düşme')+' süresi ölçülemiyor.','warn');return;}S.ti=nearest(TD,Math.max(5e-9,t/2));S.meas=[kind];say((kind==='rise'?'Yükselme':'Düşme')+' kenarı genişletildi; süre ölçümü ekranın altında.','ok');}
}
function autoset(){
  snapshot();
  let on=[0,1].filter(i=>{if(!S.ch[i].on)return false;const q=chInfo(i);return q&&(q.vmax-q.vmin>0.004||Math.abs(q.mean)>0.004);});
  if(!on.length){say('Girişte sinyal yok. Probu devreye bağla ve kanalın açık olduğundan emin ol.','warn');return;}
  const isSq=q=>q.wave==='square'||q.wave==='pulse';
  const bad=on.filter(i=>{const q=chInfo(i);return (q.freq&&q.freq<41&&!isSq(q))||(isSq(q)&&((q.vmax-q.vmin)*gainOf(i)<0.02||q.duty<=1||q.duty>=99));});
  if(bad.length===on.length){say('Autoset başarısız: sinüs frekansı en az 41 Hz, kare dalgada genlik en az 20 mVpp ve görev oranı %1\'den büyük olmalı.','warn');return;}
  on=on.filter(i=>!bad.includes(i));
  on.forEach(i=>{
    const q=chInfo(i),g=gainOf(i),c=S.ch[i];
    const vpp=(q.vmax-q.vmin)*g,mid=(c.coup==='AC'?((q.vmax+q.vmin)/2-q.mean):(q.vmax+q.vmin)/2)*g;
    const span=vpp>0.002?vpp:Math.max(Math.abs(mid)*2,0.05);
    const lo=c.probe===10?VD.indexOf(0.01):0,hi=c.probe===10?VD.length-1:VD.indexOf(10);
    c.vi=clamp(nearest(VD,Math.max(span/5,0.001),true),lo,hi);
    c.fine=false;c.pos=-mid/vdOf(c);if(c.inv)c.pos=-c.pos;
    c.pos=clamp(Math.round(c.pos*4)/4,-8,8);
  });
  const ref=on[0],q0=chInfo(ref),g=gainOf(ref),c0=S.ch[ref];
  S.ti=q0.freq?nearest(TD,(1/q0.freq)*3/12):TD.indexOf(1e-3);
  S.trig.src=ref;S.trig.slope='rise';S.mode='auto';S.run=true;S.armed=false;S.hpos=0;S.sel=ref;
  S.trig.level=(c0.coup==='AC'?((q0.vmax+q0.vmin)/2-q0.mean):(q0.vmax+q0.vmin)/2)*g*(c0.inv?-1:1);
  say('Autoset tamamlandı: dikey ölçek, zaman tabanı ve tetikleme sinyale göre ayarlandı.','ok');
}
function nearest(arr,x,up){
  if(up){for(let i=0;i<arr.length;i++)if(arr[i]>=x*0.999)return i;return arr.length-1;}
  let b=0,bd=1e18;arr.forEach((v,i)=>{const d=Math.abs(Math.log(v/x));if(d<bd){bd=d;b=i;}});return b;
}

  else if(id==='display'){S.menu='disp';S.left=null;}

function knobAct(id,dir){

function knobPress(id){

function gridSvg(){

  if(g==='full')for(let j=1;j<8;j++)o+=`<line x1="${GX0}" y1="${GY0+j*DY}" x2="${GX0+GW}" y2="${GY0+j*DY}" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="2 3"/>`;
  if(g==='grid'){for(let i=1;i<12;i++)o+=`<line x1="${GX0+i*DX}" y1="${GY0}" x2="${GX0+i*DX}" y2="${GY0+GH}" stroke="#7a7a7a" stroke-width=".9"/>`;for(let j=1;j<8;j++)o+=`<line x1="${GX0}" y1="${GY0+j*DY}" x2="${GX0+GW}" y2="${GY0+j*DY}" stroke="#7a7a7a" stroke-width=".9"/>`;}
  o+=`<rect x="${GX0}" y="${GY0}" width="${GW}" height="${GH}" fill="none" stroke="#a8a8a8" stroke-width="1.2"/>`;

  for(let j=0;j<40;j++){const y=GY0+j*GH/40;o+=`<line x1="${GCX-3}" y1="${y}" x2="${GCX+3}" y2="${y}" stroke="#7CFC9A" stroke-width=".9"/>`;}

}
function render(){

  {const ts=S.trig.src,y=clamp(chY(ts,S.trig.level),GY0,GY0+GH);o+=`<path d="M${GX0+GW} ${y} l8 -5 v10z" fill="#ff9d2e"/><text x="${GX0+GW+5}" y="${y+2.5}" font-size="6.5" font-weight="800" fill="#000" text-anchor="middle">T</text>`;
   if(Date.now()-S.lvlT<1600)o+=`<line x1="${GX0}" y1="${y}" x2="${GX0+GW}" y2="${y}" stroke="#ff9d2e" stroke-width=".9" stroke-dasharray="4 3"/>`;}
  // imleçler

    }else{
      const ya=GCY-S.curA*DY,yb=GCY-S.curB*DY;
      o+=`<line x1="${GX0}" y1="${ya}" x2="${GX0+GW}" y2="${ya}" stroke="#ff7ad9" stroke-dasharray="4 2"/><line x1="${GX0}" y1="${yb}" x2="${GX0+GW}" y2="${yb}" stroke="#ff7ad9" stroke-dasharray="4 2"/><text x="${GX0+3}" y="${ya-2}" font-size="7" fill="#ff7ad9">A</text><text x="${GX0+3}" y="${yb-2}" font-size="7" fill="#ff7ad9">B</text>`;
      const va=(S.curA-c.pos)*vd,vb=(S.curB-c.pos)*vd;
      t=[`A Y: ${siFmt(va,'V')}`,`B Y: ${siFmt(vb,'V')}`,`ΔY: ${siFmt(vb-va,'V')}`];
    }
    o+=`<rect x="${GX0+4}" y="${GY0+12}" width="108" height="${t.length*10+6}" fill="#000" fill-opacity=".72" stroke="#ff7ad9" stroke-width=".6"/>`+t.map((x,i)=>`<text x="${GX0+8}" y="${GY0+23+i*10}" font-size="7.5" fill="#ffd3f3" font-family="Menlo,Consolas,monospace">${x}</text>`).join('');

    o+=`<rect x="${GX0+2}" y="${GY0+2}" width="${GW-4}" height="${rows.length*21+6}" fill="#000" fill-opacity=".8"/>`;
    rows.forEach((r,ri)=>r.forEach((k,ci)=>{const x=GX0+6+ci*36.5;o+=`<text x="${x}" y="${GY0+12+ri*21}" font-size="5.8" fill="#fff">${MN[k].replace('Overshoot','Over').replace('Preshoot','Pre').replace('Variance','Vari').replace('Per.Area','AreaP').replace('Per.Vrms','VrmsP').replace('Delay1→2↑','Dly↑')}</text><text x="${x}" y="${GY0+20+ri*21}" font-size="5.8" font-weight="700" fill="${COL[mc]}">${mfmt(M,k)}</text>`;}));
  }
  // sol menü
  if(S.left!==null){
    const [title,items]=LEFTPAGES[S.leftPage];
    o+=`<text x="2" y="24" font-size="6.5" fill="#cfd8e8">${title}</text>`;
    [46,88,123,158,198,235].forEach((cy,i)=>{const k=items[i];if(!k)return;const on=S.meas.includes(k);
      o+=`<rect x="2" y="${cy-16}" width="40" height="32" rx="2" fill="#10151f" stroke="${on?'#ffd23f':'#5a6a85'}" stroke-width="${on?1.6:.8}"/><text x="22" y="${cy+9}" font-size="6.3" fill="#e8eeff" text-anchor="middle">${MN[k]}</text><text x="22" y="${cy-3}" font-size="9" fill="${on?'#ffd23f':'#8fb4ff'}" text-anchor="middle">${on?'✔':'□'}</text>`;});

/* ---------- Etkileşim ---------- */
const infoShow=id=>{const i=INFO[id];if(i)host.info(i[0],i[1]);};
let kdrag=null;
function kAng(e,id){const m=root.getScreenCTM().inverse(),pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(m);const [cx,cy]=KN[id];return Math.atan2(p.y-cy,p.x-cx)*180/Math.PI;}
function attach(){
  root.addEventListener('pointerdown',e=>{
    const t=e.target;
    const kp=t.closest('[data-kpress]');
    if(kp){const id=kp.dataset.kpress;kdrag={id,a:kAng(e,id),acc:0,inner:true,moved:false,x:e.clientX,y:e.clientY};kp.setPointerCapture&&kp.setPointerCapture(e.pointerId);infoShow(id);return;}
    const kn=t.closest('[data-knob]');
    if(kn){const id=kn.dataset.knob;kdrag={id,a:kAng(e,id),acc:0,inner:false,moved:true};kn.setPointerCapture&&kn.setPointerCapture(e.pointerId);infoShow(id);return;}
    const b=t.closest('[data-sc]');if(b){press(b.dataset.sc);infoShow(b.dataset.si);}
  });
  root.addEventListener('pointermove',e=>{
    if(kdrag){
      const k=kdrag;const a=kAng(e,k.id);let d=a-k.a;if(d>180)d-=360;if(d<-180)d+=360;k.a=a;k.acc+=d;
      if(k.inner&&!k.moved){if(Math.abs(k.acc)<10&&Math.hypot(e.clientX-k.x,e.clientY-k.y)<8)return;k.moved=true;}
      while(Math.abs(k.acc)>=KSTEP){const dir=k.acc>0?1:-1;k.acc-=KSTEP*dir;knobStep(k.id,dir);}
      return;
    }
    const el=e.target.closest&&e.target.closest('[data-si]');if(el&&el.dataset.si!==attach.last){attach.last=el.dataset.si;infoShow(el.dataset.si);}
  });
  const up=()=>{if(kdrag&&kdrag.inner&&!kdrag.moved){knobPress(kdrag.id);}kdrag=null;};
  root.addEventListener('pointerup',up);root.addEventListener('pointercancel',()=>{kdrag=null;});
  root.addEventListener('wheel',e=>{const kn=e.target.closest('[data-knob]');if(kn){e.preventDefault();knobStep(kn.dataset.knob,e.deltaY<0?1:-1);}},{passive:false});
}
function loop(now){
  Object.keys(kstate).forEach(id=>{
    const k=kstate[id];k.v=(k.v+(k.t-k.a)*0.18)*0.78;k.a+=k.v;if(Math.abs(k.t-k.a)<0.05&&Math.abs(k.v)<0.05){k.a=k.t;k.v=0;}
    const g=root.querySelector('#kr-'+id);if(g)g.setAttribute('transform',`rotate(${k.a} ${KN[id][0]} ${KN[id][1]})`);
  });
  if(S.power&&now-lastDraw>45){
    lastDraw=now;sigs=host.getSignals();
    if(S.run)acquire();
    render();dirty=false;
  }else if(dirty||!S.power){sigs=host.getSignals();render();dirty=false;}
  requestAnimationFrame(loop);
}
function init(h){
  host=Object.assign(host,h);root=h.root;svg=root.ownerSVGElement;
  root.innerHTML=build();attach();
  requestAnimationFrame(loop);
}
function reset(){
  const d=defaults();Object.keys(d).forEach(k=>{S[k]=d[k];});
  Object.keys(kstate).forEach(k=>{kstate[k].t=0;});
  sigs=host.getSignals();mark();
}
function halo(list){
  root.querySelectorAll('.halo').forEach(h=>h.style.display='none');
  (list||[]).forEach(n=>root.querySelectorAll(`.halo[data-h="${n}"]`).forEach(h=>h.style.display='block'));
}
return {init,S,TD,VD,vdOf,chInfo,gainOf,press,knobStep,knobPress,autoset,reset,halo,mark,measure,siFmt,shape,setMode,COL,mfmt,INFO,
  sigs:()=>sigs,refresh:()=>{sigs=host.getSignals();acquire();render();}};
})();

function buildSrc(){
  $('#srcCard').innerHTML=`<div class="stepno">Sinyal kaynakları</div><p style="margin:2px 0 0;font-size:.85rem;color:var(--sub)">Osiloskop girişlerine bağlı sinyali seç (gerçek laboratuvarda bu bir üreteç ya da devre olur).</p>`+[0,1].map(i=>`<div class="srcrow"><b style="color:${i?'#0f87b3':'#b98a00'}">CH${i+1}:</b> <select id="sel${i}">${SRCOPT.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select>
   <div class="cust" id="cust${i}"><select id="cw${i}">${Object.keys(NAMES).map(k=>`<option value="${k}">${NAMES[k]}</option>`).join('')}</select> f<input id="cf${i}" type="number" step="any"> Hz · Vpp<input id="ca${i}" type="number" step="any"> · ofs<input id="co${i}" type="number" step="any"> V · duty<input id="cd${i}" type="number" step="any"> % · faz<input id="cp${i}" type="number" step="any"> °</div></div>`).join('');

function syncSrc(){
  [0,1].forEach(i=>{
    $('#sel'+i).value=SRC[i].kind;
    const c=SRC[i].c;$('#cw'+i).value=c.wave;$('#cf'+i).value=c.freq;$('#ca'+i).value=c.amp;$('#co'+i).value=c.off;$('#cd'+i).value=c.duty;$('#cp'+i).value=c.phase;

Scope.init({root:$('#scopeRoot'),getSignals,onComp:()=>{setSrc(0,'comp');Scope.mark();say('Prob kompanzasyon çıkışı CH1 girişine bağlandı (1 kHz, 0–3 V kare dalga). AUTO\'ya bas.','ok');},say,info:(t,b)=>{renderInfo(t,b);}});

/* ---------- Demo ---------- */
let demoId=0,busy=0;
function runDemo(seq){
  const id=++demoId;let i=0;busy=1;setBtns();
  const next=()=>{
    if(id!==demoId)return;
    if(i>=seq.length){busy=0;setBtns();return;}
    const tk=seq[i++];
    if(tk.startsWith('kn:')){const [,k,d]=tk.split(':');Scope.knobStep(k,+d);}
    else if(tk.startsWith('kp:'))Scope.knobPress(tk.slice(3));
    else if(tk.startsWith('sc:'))Scope.press(tk.slice(3));
    setTimeout(next,tk.startsWith('kn:')?430:800);
  };

}

  {t:'Kuplaj: CH1 tuşuna basınca sağ menüde Coupling çıkar. DC: sinyalin DC bileşeni görünür (bu sinyal 0–3 V; ortalama 1.5 V). AC: DC bileşen süzülür, sinyal sıfır etrafında görünür.',hl:['chs','right'],set:()=>{Scope.autoset();S.menu='ch';},demo:['sc:r0']},
  {t:'GND kuplaj: giriş topraklanır; sıfır seviyesini (referans çizgisini) görürsün. Kuplaj tuşu DC → AC → GND sırayla döner.',hl:['right'],set:()=>{Scope.autoset();S.menu='ch';S.ch[0].coup='AC';},demo:['sc:r0']},
  {t:'Prob uyumu: osiloskopun varsayılan prob ayarı 10X ve probun anahtarı da 10X olmalı. Prob anahtarı 1X\'e alınırsa ama osiloskop ayarı 10X kalırsa gerilim 10 kat BÜYÜK okunur. Kırmızı etiket eşleşmemeyi gösterir.',hl:['probe1','right'],set:()=>{Scope.autoset();S.menu='ch';},demo:['sc:probe1']},
  {t:'Düzeltme: CH1 menüsünde Probe\'u (3. sağ tuş) 1X yap. Şimdi gerçek anahtar ve ayar eşleşir; Vpp yine ≈ 3 V okunur. Gerçek ölçümde bu eşleşmeyi her zaman kontrol et.',hl:['right','probe1'],set:()=>{Scope.autoset();S.menu='ch';S.phys[0]=1;},demo:['sc:r2']}
 ]},
 {tab:'3 Yatay',title:'Yatay ayarlar',steps:[
  {t:'Yatay SCALE düğmesi zaman tabanını ayarlar. Saat yönünde: s/div azalır, ekranda daha az zaman görünür (dalga genişler). Üstteki "H" değerini izle.',hl:['hscale'],set:()=>{Scope.autoset();},demo:['kn:hscale:1','kn:hscale:1','kn:hscale:-1','kn:hscale:-1','kn:hscale:-1','kn:hscale:-1']},
  {t:'Çok yavaş zaman tabanında (örn. 100 μs/div → 10 ms/div) ekranda onlarca periyot görünür ve dalga yoğun bir banda dönüşür; çok hızlıda yalnızca küçük bir parçası görünür.',hl:['screen'],set:()=>{Scope.autoset();S.ti=ti(2e-3);}},
  {t:'Üstteki örnekleme hızı ve bellek derinliği zaman tabanına göre değişir: yavaş tarama = daha düşük örnekleme hızı. Yüksek frekanslı sinyalde yeterli örnek olması için hızlı tarama gerekir.',hl:['screen'],set:()=>{Scope.autoset();S.ti=ti(2e-3);}},
  {t:'Yatay POSITION düğmesi tetikleme noktasını (üstteki turuncu ▼) sağa/sola kaydırır. Böylece tetikleme anından önceki ya da sonraki kısmı incelersin. Basınca sıfıra döner.',hl:['hpos'],set:()=>{Scope.autoset();},demo:['kn:hpos:1','kn:hpos:1','kn:hpos:1','kn:hpos:-1','kn:hpos:-1','kn:hpos:-1','kp:hpos']}
 ]},
 {tab:'4 Tetikleme',title:'Tetikleme (Trigger)',steps:[
  {t:'Tetikleme, her taramanın aynı noktadan başlamasını sağlar; böylece periyodik dalga ekranda durağan görünür. Turuncu "T" oku tetikleme seviyesidir; sağ üstte seviye ve kenar yazar.',hl:['screen'],set:()=>{Scope.autoset();}},
  {t:'Tetikleme seviyesi LEVEL düğmesiyle ayarlanır. Düğmeyi çevir, kesikli çizgi seviyeyi gösterir. Seviye sinyalin içinde kaldığı sürece dalga durağandır. Basarsan seviye sıfıra (0 V) döner.',hl:['tlevel'],set:()=>{Scope.autoset();},demo:['kn:tlevel:1','kn:tlevel:1','kn:tlevel:-1','kn:tlevel:-1','kp:tlevel']},
  {t:'Seviyeyi sinyalin genlik aralığının DIŞINA çıkarırsan tetikleme olmaz. Auto modunda ekran yine de güncellenir ama dalga başlangıç noktası rastgele olduğundan titrer/kayar. Duran görüntü yoksa ilk bakılacak yer burasıdır.',hl:['tlevel','screen'],set:()=>{Scope.autoset();S.trig.level=5;}},
  {t:'MODE tuşuyla Normal moda geç: tetikleme yoksa ekran güncellenmez, üstte WAIT yazar (son iz donuk kalır). Auto\'da ise AUTO yazar.',hl:['tmode'],set:()=>{Scope.autoset();S.trig.level=5;},demo:['sc:tmode']},
  {t:'Kenar (Slope): MENU\'ye bas, 3. sağ tuş ↑ yükselen ↔ ↓ düşen kenarı seçer. Kare dalgada tetik noktası yükselen ya da düşen kenara gelir; dalga ekranda buna göre kayar.',hl:['tmenu','right'],set:()=>{Scope.autoset();S.menu='trig';},demo:['sc:r2']},
  {t:'Tetikleme kaynağı: MENU\'de 2. sağ tuş CH1/CH2 seçer. İki kanallı ölçümde, referans aldığın kanalı kaynak yap.',hl:['tmenu','right'],set:()=>{Scope.autoset();S.menu='trig';}}
 ]},
 {tab:'5 Ölçüm / imleç',title:'Otomatik ölçüm ve imleçler',steps:[
  {t:'Measure tuşuna bas: soldaki 6 tuş ölçüm listesidir (Period, Freq, Rise Time, Fall Time, +Width, −Width). Seçili olanlar sarı çerçeveli ve ekranın altında değerleri görünür.',hl:['measure','left'],set:()=>{Scope.autoset();S.meas=['freq','period','vpp','vmax','vmin'];},demo:['sc:measure']},
  {t:'Sağ menüde AllMeasure\'ı açarsan tüm ölçümler ızgaranın üstüne tablo olarak gelir: Vmax, Vmin, Vpp, Vtop, Vbase, Vamp, Vavg, Vrms, Freq, Period, +Duty, −Duty...',hl:['right'],set:()=>{Scope.autoset();S.menu='meas';S.left=0;},demo:['sc:r1']},
  {t:'Ölçümlerin güvenilir olması için ekranda en az bir kaç periyot görünmeli. Zaman tabanı çok hızlıysa Freq ve Period "*****" olur. Doğru ölçüm için AUTO ya da uygun s/div kullan.',hl:['screen'],set:()=>{Scope.autoset();S.ti=ti(1e-4);S.meas=['freq','period','pwidth','pduty','vpp'];S.left=0;S.menu='meas';}},
  {t:'Cursor tuşuna bir kez bas: zaman (X) imleçleri çıkar. Çok işlevli düğmeyle imleci hareket ettir; ΔX ve 1/ΔX (frekans) ekranda görünür. Sağ menüden CurA, CurB ya da CurAB seç.',hl:['cursor','multi'],set:()=>{Scope.autoset();},demo:['sc:cursor','kn:multi:1','kn:multi:1','kn:multi:1']},
  {t:'Cursor\'a ikinci basışta gerilim (Y) imleçleri çıkar: ΔY ile tepeden tepeye gerilimi bölme saymadan okursun. Üçüncü basışta imleçler kapanır.',hl:['cursor','multi'],set:()=>{Scope.autoset();S.cur=1;S.menu='cursor';},demo:['sc:cursor','kn:multi:1','kn:multi:1']}
 ]},
 {tab:'6 İki kanal / faz',title:'İki kanal ve faz farkı',steps:[
  {t:'CH1 ve CH2\'ye aynı frekansta (1 kHz) iki sinüs bağlı: CH2, CH1\'e göre 90° ilerde. CH2 tuşuna basarak ikinci kanalı aç.',hl:['ch2'],set:()=>{setSrc(0,'custom',{wave:'sine',freq:1000,amp:2,off:0,duty:50,phase:0});setSrc(1,'custom',{wave:'sine',freq:1000,amp:2,off:0,duty:50,phase:90});},demo:['sc:ch2']},
  {t:'İki kanal açık. Kanal çubuğunda 1 ve 2 görünür; seçili olan renkli dolu kutudur. Dikey düğmeler seçili kanala etki eder. Tetikleme kaynağı CH1 olduğundan CH1 sabit, CH2 ona göre kayık görünür.',hl:['chs','screen'],set:()=>{setSrc(0,'custom',{wave:'sine',freq:1000,amp:2,off:0,duty:50,phase:0});setSrc(1,'custom',{wave:'sine',freq:1000,amp:2,off:0,duty:50,phase:90});S.ch[1].on=true;Scope.autoset();}},
  {t:'Faz farkı ölçümü: Cursor ile CH1\'in sıfır geçişi ile CH2\'ninkini işaretle, ΔX\'i oku. Faz = ΔX / T × 360°. T = 1 ms, ΔX ≈ 250 μs ise 90° bulunur.',hl:['cursor','multi'],set:()=>{setSrc(0,'custom',{wave:'sine',freq:1000,amp:2,off:0,duty:50,phase:0});setSrc(1,'custom',{wave:'sine',freq:1000,amp:2,off:0,duty:50,phase:90});S.ch[1].on=true;Scope.autoset();S.cur=1;S.curA=0;S.curB=1.5;S.menu='cursor';}},
  {t:'Faz farkı 180° ise iki sinyal birbirinin tersidir; 0° ise üst üste biner. Güç elektroniğinde 3 faz (120°) ve yarım köprü kapı sinyalleri (180°) için faz ölçümü gerekir.',hl:['screen'],set:()=>{setSrc(0,'custom',{wave:'sine',freq:1000,amp:2,off:0,duty:50,phase:0});setSrc(1,'custom',{wave:'sine',freq:1000,amp:2,off:0,duty:50,phase:180});S.ch[1].on=true;Scope.autoset();}}
 ]},
 {tab:'7 SINGLE / STOP',title:'Tek yakalama ve durdurma',steps:[
  {t:'RUN/STOP tuşuna bas: ekran donar (STOP, kırmızı). Dikey ölçek ve imleçler artık donmuş iz üzerinde incelenebilir. Tekrar basınca çalışmaya devam eder.',hl:['runstop'],set:()=>{Scope.autoset();},demo:['sc:runstop']},
  {t:'SINGLE: tetikleme gelince ekranı bir kez yakalar ve durur. Geçici olayları (anahtarlama, tek darbe) yakalamak için kullanılır. Tuş sarı yanar ve WAIT görünür.',hl:['single'],set:()=>{Scope.autoset();S.trig.level=5;},demo:['sc:single']},
  {t:'Tetikleme seviyesini sinyalin içine getirirsen yakalama gerçekleşir ve STOP olur. FORCE tuşu da koşul olmasa bile bir yakalama zorlar.',hl:['tlevel','force'],set:()=>{Scope.autoset();S.trig.level=5;S.mode='single';S.armed=true;S.status='WAIT';},demo:['kn:tlevel:-1','kn:tlevel:-1','kn:tlevel:-1','kn:tlevel:-1','kn:tlevel:-1','kn:tlevel:-1','kn:tlevel:-1']}
 ]}
];
const TABS=[...LESSONS.map((l,i)=>({tab:l.tab,i})),{tab:'Serbest mod',i:'free'},{tab:'Sınav',i:'quiz'}];
const chips=$('#chips');
TABS.forEach((t,idx)=>{const b=document.createElement('button');b.textContent=t.tab;b.dataset.i=idx;b.onclick=()=>openTab(idx);chips.appendChild(b);});
const G={mode:'lesson',lesson:0,step:0};
function resetAll(){
  stopDemo();Scope.reset();
  SRC[0].kind='comp';SRC[1].kind='none';
  Object.assign(SRC[0].c,PRE.sine1k);Object.assign(SRC[1].c,PRE.sine1k);syncSrc();
}
function openTab(idx){
  chips.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===idx));
  const t=TABS[idx];Scope.halo([]);
  if(t.i==='free'){G.mode='free';resetAll();Scope.autoset();renderFree();}
  else if(t.i==='quiz'){G.mode='quiz';startQuiz();}
  else{G.mode='lesson';G.lesson=t.i;enterStep(0);}
}
function enterStep(n){
  const les=LESSONS[G.lesson];G.step=n;resetAll();
  Scope.refresh();
  for(let i=0;i<=n;i++){const a=les.steps[i].set;if(a)a();}
  Scope.halo(les.steps[n].hl);Scope.mark();
  renderLesson();say('');
}
function renderLesson(){
  const les=LESSONS[G.lesson],st=les.steps[G.step],last=G.step===les.steps.length-1;
  $('#lessonCard').innerHTML=`<div class="stepno">${les.tab} · Adım ${G.step+1}/${les.steps.length}</div><h2>${les.title}</h2><p>${st.t}</p>
   <div class="row"><button class="b" id="pv" ${G.step===0?'disabled':''}>◀ Önceki</button>${st.demo?'<button class="b" id="dm">▶ Göster</button>':''}<button class="b pri" id="nx">${last?(G.lesson<LESSONS.length-1?'Sonraki ders ▶':'Serbest moda geç ▶'):'Sonraki ▶'}</button></div>`;
  $('#pv').onclick=()=>enterStep(G.step-1);
  if(st.demo)$('#dm').onclick=()=>{enterStep(G.step);runDemo(st.demo);};
  $('#nx').onclick=()=>{if(!last)enterStep(G.step+1);else openTab(G.lesson<LESSONS.length-1?G.lesson+1:TABS.length-2);};
}
function renderFree(){
  $('#lessonCard').innerHTML=`<div class="stepno">Serbest mod</div><h2>Kendin dene</h2><p>Sağdaki "Sinyal kaynakları" kartından CH1/CH2 girişlerine bir sinyal bağla (Özel… ile kendi frekans, genlik, offset ve görev oranını gir). Sonra AUTO'ya bas ve ölçek, tetikleme, ölçüm ve imleçlerle çalış.</p>
  <p style="font-size:.88rem;color:var(--sub)">İpucu: büyük düğmeleri sürükleyerek ya da fare tekerleğiyle çevir, düğmenin ortasına basınca sıfırlanır/ortalanır.</p>`;
}

/* ---------- Sınav ---------- */
const near=(a,b,t=0.03)=>Math.abs(a-b)<=Math.abs(b)*t;
const TASKS=[
 {t:'Prob kompanzasyon sinyali CH1\'e bağlı. AUTO ile görüntüle ve Measure\'dan Freq ölçümünü ekranda göster.',set:()=>{S.ch[0].vi=vi(5);S.ti=ti(1e-1);},c:()=>{const f=[];if(Scope.sigs()[0]&&TD[S.ti]>1e-3*1.01)f.push('Zaman tabanı hâlâ çok yavaş: AUTO\'ya bas');if(!S.meas.includes('freq'))f.push('Freq ölçümü eklenmeli (Measure → soldaki tuş)');const M=Scope.measure(0);if(!M||M.freq==null)f.push('Freq okunamıyor (*****): zaman tabanını ayarla');return f;}},
 {t:'Zaman tabanını 500 μs/div yap.',set:()=>{Scope.autoset();},c:()=>TD[S.ti]===5e-4?[]:['Şu an '+Scope.siFmt(TD[S.ti],'s')+'/div; hedef 500 μs/div']},
 {t:'CH1 dikey ölçeğini 1 V/div yap.',set:()=>{Scope.autoset();},c:()=>Scope.vdOf(S.ch[0])===1?[]:['Şu an '+Scope.siFmt(Scope.vdOf(S.ch[0]),'V')+'/div; hedef 1 V/div']},
 {t:'CH1 kuplajını AC yap (DC bileşen süzülsün).',set:()=>{Scope.autoset();},c:()=>S.ch[0].coup==='AC'?[]:['CH1 kuplajı AC olmalı (CH1 tuşu → Coupling)']},
 {t:'Tetikleme kenarını düşen (↓) yap ve Normal moda geç.',set:()=>{Scope.autoset();},c:()=>{const f=[];if(S.trig.slope!=='fall')f.push('Kenar ↓ (Fall) olmalı');if(S.mode!=='normal')f.push('Mod Normal olmalı (MODE tuşu)');return f;}},
 {t:'Single moduna al ve bir yakalama yap (osiloskop STOP durumunda kalsın).',set:()=>{Scope.autoset();},c:()=>{const f=[];if(S.mode!=='single')f.push('Mod Single olmalı');if(S.run)f.push('Henüz yakalama olmadı (hâlâ RUN). Tetik seviyesini sinyal içine getir ya da FORCE\'a bas');return f;}},
 {t:'Cursor ile X imleçlerini aç ve ΔX ≈ 1 ms (kare dalganın periyodu) olacak şekilde ayarla.',set:()=>{Scope.autoset();},c:()=>{const f=[];if(S.cur!==1)f.push('X imleçleri açık olmalı (Cursor tuşu bir kez)');else{const dx=Math.abs(S.curB-S.curA)*TD[S.ti];if(!near(dx,1e-3,0.06))f.push('ΔX = '+Scope.siFmt(dx,'s')+'; hedef ≈ 1 ms');}return f;}},
 {t:'CH1 probunun fiziksel anahtarını 1X yap ve osiloskop Probe ayarını da 1X yaparak eşleştir; ölçülen Vpp ≈ 3 V kalsın.',set:()=>{Scope.autoset();},c:()=>{const f=[];if(S.phys[0]!==1)f.push('Prob anahtarı 1X olmalı (CH1 altındaki etiket)');if(S.ch[0].probe!==1)f.push('Probe ayarı 1X olmalı (CH1 menüsü)');const M=Scope.measure(0);if(!M||!near(M.vpp,3,0.05))f.push('Vpp ≈ 3 V okunmuyor'+(M?' (şimdi '+Scope.siFmt(M.vpp,'V')+')':''));return f;}}
];
const Q={order:[],i:0,score:0};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startQuiz(){Q.order=shuffle(TASKS.map((_,i)=>i)).slice(0,6);Q.i=0;Q.score=0;loadQ();}
function loadQ(){
  resetAll();Scope.refresh();const t=TASKS[Q.order[Q.i]];t.set();Scope.mark();
  $('#lessonCard').innerHTML=`<div class="stepno">Sınav · Soru ${Q.i+1}/${Q.order.length} · Puan ${Q.score}</div><h2>Görev</h2><p>${t.t}</p><div class="row"><button class="b pri" id="ans">Kontrol et</button></div>`;
  $('#ans').onclick=checkAns;say('Osiloskobu gerçek tuşlarla ayarla, sonra Kontrol et\'e bas.');
}
function checkAns(){
  const t=TASKS[Q.order[Q.i]],f=t.c(),good=f.length===0;if(good)Q.score++;
  const last=Q.i===Q.order.length-1;
  $('#lessonCard').innerHTML=`<div class="stepno">Sınav · Soru ${Q.i+1}/${Q.order.length} · Puan ${Q.score}</div><h2>${good?'✔ Doğru':'✖ Eksik/yanlış'}</h2><p>${good?'Tebrikler!':f.join('<br>')}</p><div class="row"><button class="b pri" id="nq">${last?'Sonucu gör':'Sonraki görev ▶'}</button></div>`;
  $('#nq').onclick=()=>{if(last)endQuiz();else{Q.i++;loadQ();}};
  say(good?'Doğru!':'Eksikler var.',good?'ok':'bad');
}
function endQuiz(){
  const p=Q.score,n=Q.order.length;
  $('#lessonCard').innerHTML=`<div class="stepno">Sınav bitti</div><h2>Puanın: ${p}/${n}</h2><p>${p===n?'Mükemmel! Osiloskobu rahatça kullanabilirsin.':p>=n*.7?'İyi! Eksik kalan konuları tekrar et.':'Dersleri tekrar gözden geçirip yeniden dene.'}</p><div class="row"><button class="b pri" id="rq">Tekrar dene</button></div>`;
  $('#rq').onclick=startQuiz;say('');
}
buildSrc();
openTab(0);
</script>
</body>
</html>
